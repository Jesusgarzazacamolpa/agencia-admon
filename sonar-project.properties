sonar.projectKey=vehicle-domain-service
sonar.projectName=vehicle-domain-service
sonar.host.url=http://localhost:9000
sonar.login=${SONAR_TOKEN}

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.coverage.exclusions=**/dto/**,**/domain/model/**,**/entity/**,**/config/**,**/*Application.java
sonar.cpd.exclusions=**/entity/**,**/dto/**,**/*Application.java

sonar.java.checkstyle.skip=false
sonar.cpd.java.minimum-lines=10
